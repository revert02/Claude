<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#141414">
    <title>Theater</title>
    <link rel="stylesheet" href="styles.css?v=20260406b">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <!-- API Key Modal -->
    <div id="apiKeyModal" class="modal hidden">
        <div class="modal-content">
            <div class="nf-logo">THEATER</div>
            <p>Enter your TMDB API key to get started.<br>
            <a href="https://www.themoviedb.org/settings/api" target="_blank">Get a free key here</a></p>
            <input type="text" id="apiKeyInput" placeholder="Your TMDB API key..." autocomplete="off">
            <button id="apiKeySubmit" class="btn-red">Get Started</button>
            <button id="apiKeyDemo" class="btn-outline">Use Demo Mode</button>
        </div>
    </div>

    <div id="app" class="app">
        <!-- Header — Netflix style transparent -->
        <header id="appHeader" class="nf-header">
            <div class="nf-logo-sm">T</div>
            <nav class="nf-nav">
                <button class="nf-nav-item active" data-tab="home" onclick="switchTab('home')">Home</button>
                <button class="nf-nav-item" data-tab="search" onclick="switchTab('search')">Search</button>
                <button class="nf-nav-item" data-tab="watchlist" onclick="switchTab('watchlist')">My List</button>
            </nav>
        </header>

        <main>
            <!-- Home -->
            <div id="homeTab" class="tab-content active">
                <div class="scrollable" id="homeScroll">
                    <!-- Category pills -->
                    <div class="category-pills" id="categoryPills">
                        <button class="cat-pill active" data-cat="all" onclick="filterCategory('all')">All</button>
                        <button class="cat-pill" data-cat="movie" onclick="filterCategory('movie')">Films</button>
                        <button class="cat-pill" data-cat="tv" onclick="filterCategory('tv')">TV Shows</button>
                        <button class="cat-pill" data-cat="animation" onclick="filterCategory('animation')">Animation</button>
                        <button class="cat-pill" data-cat="anime" onclick="filterCategory('anime')">Anime</button>
                    </div>
                    <!-- Billboard -->
                    <div id="billboard" class="billboard">
                        <div class="billboard-bg" id="billboardBg"></div>
                        <div class="billboard-gradient"></div>
                        <div class="billboard-info" id="billboardInfo"></div>
                    </div>
                    <!-- Rows -->
                    <div id="rows"></div>
                </div>
            </div>

            <!-- Search -->
            <div id="searchTab" class="tab-content">
                <div class="scrollable">
                    <div class="search-wrap">
                        <input type="search" id="searchInput" class="nf-search" placeholder="Search for a title...">
                    </div>
                    <div id="platformFilters" class="nf-chips"></div>
                    <div id="genreFilters" class="nf-chips"></div>
                    <div id="searchResults" class="nf-grid"></div>
                    <div id="searchEmpty" class="empty hidden">
                        <p>No results found</p>
                    </div>
                    <div id="browseGenres" class="genre-grid"></div>
                </div>
            </div>

            <!-- My List -->
            <div id="watchlistTab" class="tab-content">
                <div class="scrollable">
                    <h2 class="section-title" style="padding-top:60px">My List</h2>
                    <div class="nf-chips" id="watchlistFilters">
                        <button class="nf-chip active" data-filter="all" onclick="setWatchlistFilter('all')">All</button>
                        <button class="nf-chip" data-filter="movie" onclick="setWatchlistFilter('movie')">Movies</button>
                        <button class="nf-chip" data-filter="tv" onclick="setWatchlistFilter('tv')">TV Shows</button>
                    </div>
                    <div id="watchlistContent" class="nf-grid"></div>
                    <div id="watchlistEmpty" class="empty">
                        <p>Add movies and shows to your list to see them here.</p>
                    </div>
                </div>
            </div>

            <!-- Detail Modal -->
            <div id="detailView" class="nf-modal hidden">
                <div class="nf-modal-scroll" id="detailScroll">
                    <div class="nf-modal-backdrop" id="detailBackdrop">
                        <button class="nf-close" onclick="closeDetail()">&#10005;</button>
                    </div>
                    <div class="nf-modal-body" id="detailBody"></div>
                </div>
            </div>
        </main>

        <!-- Bottom Tab Bar (mobile Netflix style) -->
        <nav class="nf-tabbar">
            <button class="nf-tab active" data-tab="home" onclick="switchTab('home')">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M13 3v6h8V3m-8 18h8V11h-8M3 21h8v-6H3m0-2h8V3H3v10z"/></svg>
                <span>Home</span>
            </button>
            <button class="nf-tab" data-tab="search" onclick="switchTab('search')">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <span>Search</span>
            </button>
            <button class="nf-tab" data-tab="watchlist" onclick="switchTab('watchlist')">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5l2.09 4.26L19 10l-3.5 3.41L16.18 19 12 16.77 7.82 19l.68-5.59L5 10l4.91-.74z"/></svg>
                <span>My List</span>
            </button>
        </nav>
    </div>

    <script src="app.js?v=20260406b"></script>
</body>
</html>
